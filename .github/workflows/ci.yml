name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · bench-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify public subpath exports resolve
        # Guards the `seebo/actions` subpath export so a broken `exports` map fails CI loudly.
        run: |
          node --input-type=module -e "
            const root = await import('seebo');
            const actions = await import('seebo/actions');
            if (typeof root.createEngine !== 'function') throw new Error('seebo: createEngine missing');
            if (typeof actions.executeActionPlan !== 'function') throw new Error('seebo/actions: executeActionPlan missing');
            console.log('subpath exports OK');
          "

      - name: Bench smoke
        run: npm run bench:smoke

name: Release

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
# Requires the repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (format, lint, typecheck, test)
        run: npm run check

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
